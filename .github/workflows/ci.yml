name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + build
    runs-on: ubuntu-latest
    env:
      DB_USER: ci # picks the Linux SQL driver when modules load (no database is used here)
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: API unit tests
        working-directory: server
        run: |
          npm ci --omit=optional
          npm test

      - name: Web build + parser tests
        working-directory: client
        run: |
          npm ci
          npm test
          npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
    env:
      DB_SERVER: localhost
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: Ci-Passw0rd!
      DB_DATABASE: expense_ci
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Ci-Admin-Passw0rd
      TZ: Asia/Jakarta
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: Ci-Admin-Passw0rd
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Start the API
        working-directory: server
        run: |
          npm ci --omit=optional
          npm run setup-db
          nohup node src/server.js > ../api.log 2>&1 &

      - name: Start the web app (production build, /api proxied to the API)
        working-directory: client
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &

      - name: Wait for both
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 2
          done
          cat api.log web.log
          exit 1

      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs and report on failure
        if: failure()
        run: cat api.log web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
