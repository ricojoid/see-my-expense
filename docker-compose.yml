# See My EX-pense: API + web. The database is an existing SQL Server, set in .env.
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d --build
#
# No SQL Server yet? Add the bundled one with docker-compose.db.yml (see .env.example).
# The app is then on http://<server>:${APP_PORT:-8080}

services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_SERVER: ${DB_SERVER:-host.docker.internal}
      DB_PORT: ${DB_PORT:-1433}
      DB_DATABASE: ${DB_DATABASE:-expense_tracker}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TOKEN_TTL: ${TOKEN_TTL:-7d}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      TZ: Asia/Jakarta
    # Lets the container reach SQL Server published on the host (e.g. another container on port 1433).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
